name: Deploy Backend to Render

on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear build cache before deployment'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLEAR_CACHE: ${{ github.event.inputs.clear_cache }}
        run: |
          if [ "$CLEAR_CACHE" = "true" ]; then
            echo "Triggering deployment with cache clear..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL?clear_cache=true"
          else
            echo "Triggering deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi

      - name: Wait for deployment to start
        run: sleep 10

      - name: Deployment Summary
        env:
          COMMIT_SHA: ${{ github.sha }}
          CACHE_CLEARED: ${{ github.event.inputs.clear_cache }}
        run: |
          echo "### Backend Deployment Triggered! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** apps-dashboard-api" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- **Clear Cache:** $CACHE_CLEARED" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** https://apis.darshjoshi.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check deployment status in [Render Dashboard](https://dashboard.render.com)" >> $GITHUB_STEP_SUMMARY
